name: 設定切替の回帰テスト

on:
  push:
  pull_request:

jobs:
  switch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
      - name: 通常起動の回帰テスト用にzshを準備する
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - run: bash -n scripts/switch.sh
      - run: bash -n scripts/legacy-switch.sh
      - run: python3 -m py_compile scripts/*.py
      - run: python3 scripts/run_test_inventory.py --output test-results
      - name: ケース別テスト結果を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-results
          path: test-results/
          retention-days: 14
