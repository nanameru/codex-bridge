version: 1
project:
  name: codex-bridge
  repo: nanameru/codex-bridge
  test_command: python3 -m unittest discover -s test -p 'test_*.py'
source_roots: [src, scripts]
cases:
  - id: TC-023
    title: "OpenCode直結回答: phaseをfinal_answerへ正規化する"
    feature: "応答表示の互換性"
    scenario: "phaseを持たないOpenCode assistant messageをfinal_answerへ補完し、既存phaseとツール項目を変更しない"
    status: done
    priority: high
    type: regression
    source: [src/tool-adapter.mjs, src/model-router.mjs]
    test_file: test/tool-adapter.test.mjs
    issues: [37]
    notes: "GPTとOpenCodeのapp-serverイベント差を実測し、direct SSE・通常JSON・chatブリッジのphase補完を検証。既存commentaryとfunction_callは保持。実APIではephemeral DeepSeek応答がfinal_answerになり、item/startedとitem/completedが各1回であることを確認。"
  - id: TC-022
    title: "Flashコードモード: 標準execで実行しプロンプトを変更しない"
    feature: "ツール定義の軽量化"
    scenario: "Flashのツール設定3項目だけを更新し、標準コードモードのツール結果を公式Responsesへ返す"
    status: done
    priority: high
    type: integration
    source: [scripts/unified_config.py, test/codex-code-mode-e2e.py, test/mock-unified.mjs]
    test_file: test/test_code_mode_probe.py
    issues: [35]
    notes: "模擬E2EおよびGo実API2要求でprintf1回・exit0・結果返送を確認。test/test_unified_config.pyでGPT/Pro/指示保持、バックアップ、冪等性、旧接続拒否、リンク拒否、CLI非fallthroughを検証。本番反映は未実施、全MCP/CUA互換は未検証。"
  - id: TC-021
    title: "速度比較: GPTとDeepSeekの利用者設定と履歴条件を揃える"
    feature: "同条件の速度計測"
    scenario: "新規スレッド・共通入力・推論強度lowを維持し、初回と反復、usageとツール数を分けて記録する"
    status: done
    priority: medium
    type: regression
    source: [test/live-router-smoke.py]
    test_file: test/test_live_comparison.py
    issues: [33]
    notes: "模擬app-serverで条件一致・指示非上書き・4回上限・順序反転・失敗時停止・本文非出力・設定分離を検証。実課金比較は未実行で速度差やキャッシュヒットは未検証。モデル固有の既定指示は維持。"
  - id: TC-020
    title: "公式接続: APIキーとCodex標準圧縮だけでOpenCodeへ接続する"
    feature: "公式Responses直接接続"
    scenario: "対応モデルを直接転送し、通常codex起動でもCodex標準local compactionを利用する"
    status: done
    priority: high
    type: integration
    source: [src/model-router.mjs, scripts/unified_config.py, scripts/direct_codex.py, scripts/direct_launch.py]
    test_file: test/model-router.test.mjs
    issues: [31]
    notes: "認証分離、ログインDB非読取、未変換のcustom/推論/圧縮、失敗時非fallback、APIキー非引数化を検証。test/codex-direct-e2e.py --normalでprofile指定なしの通常codex起動→標準local compact往復（Responses4回、GPT/remote compactなし）を確認。markerなし旧スレッドとGPTカタログの保持も検証。"
