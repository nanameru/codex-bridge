version: 1
project:
  name: codex-bridge
  repo: nanameru/codex-bridge
  test_command: python3 -m unittest discover -s test -p 'test_*.py'
source_roots: [src, scripts]
cases:
  - id: TC-001
    title: "モデル切替: on offで接続定義と元設定を保持する"
    feature: "モデル切替"
    scenario: "on offで接続定義と元設定を保持する"
    status: done
    priority: medium
    type: regression
    source: [scripts/switch.sh, scripts/switch_config.py]
    test_file: test/test_switch.py
    issues: [1]
    notes: "8件の回帰テスト。接続定義保持、元設定復元、自動再起動なし、不正入力、旧版移行を検証。"
  - id: TC-002
    title: "切替アプリの接続: 実配布先から安全な切替スクリプトを呼ぶ"
    feature: "切替アプリの接続"
    scenario: "実配布先から安全な切替スクリプトを呼ぶ"
    status: done
    priority: medium
    type: regression
    source: [scripts/legacy-switch.sh]
    test_file: test/test_recover_thread.py
    issues: [3]
    notes: "旧メニューバー用の入口でも8件の設定切替回帰テストが成功。実配布先と同一内容を確認。"
  - id: TC-003
    title: "会話の復旧: 元の会話を保持してOpenAIへ履歴付き分岐する"
    feature: "会話の復旧"
    scenario: "元の会話を保持してOpenAIへ履歴付き分岐する"
    status: done
    priority: medium
    type: regression
    source: [scripts/recover_thread.py]
    test_file: test/test_recover_thread.py
    issues: [3]
    notes: "正式fork・接続先・実行中拒否・推論なし・stdio・異常メタデータ・終了タイムアウト・o系モデルを検証。全27件成功。現環境でも履歴保持とOpenAI接続を確認。"
  - id: TC-004
    title: "双方向モデル切替: 同じ会話の送信先を認証分離して振り分ける"
    feature: "双方向モデル切替"
    scenario: "同じ会話の送信先を認証分離して振り分ける"
    status: done
    priority: medium
    type: regression
    source: [src/model-router.mjs, src/tool-adapter.mjs]
    test_file: test/model-router.test.mjs
    issues: [5]
    notes: "認証分離、両方向、圧縮、未知モデル、履歴、リダイレクト拒否、タイムアウト。freeformツールはtest/tool-adapter.test.mjsで検証。"
  - id: TC-005
    title: "統合設定: 既存設定を保持して有効化と復元を行う"
    feature: "統合設定"
    scenario: "既存設定を保持して有効化と復元を行う"
    status: done
    priority: medium
    type: regression
    source: [scripts/unified_config.py, scripts/switch_config.py, scripts/install_router_service.py]
    test_file: test/test_unified_config.py
    issues: [5]
    notes: "設定の可逆性、カタログ、legacy切替との共存、複数行文字列、常駐登録解除待ちを検証。"
  - id: TC-006
    title: "同じ会話IDでCodexのモデルを両方向に切り替える"
    feature: "双方向モデル切替"
    scenario: "ChatGPT型の偽認証と模擬接続先で実Codexの双方向切替と保存会話の再開を検証する"
    status: done
    priority: high
    type: integration
    source: [src/model-router.mjs, src/tool-adapter.mjs, scripts/unified_config.py]
    test_file: test/codex-router-e2e.py
    issues: [5]
    notes: "ローカルCodex 0.163で双方向6ターンと同じIDでの保存会話再開2ターンを検証。外部推論なし。Codexとカタログが必要なためCI対象外。実応答も任意のlive-router-smoke.pyで確認済み。"
