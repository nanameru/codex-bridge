version: 1
project:
  name: codex-bridge
  repo: nanameru/codex-bridge
  test_command: python3 -m unittest discover -s test -p 'test_*.py'
source_roots: [src, scripts]
cases:
  - id: TC-013
    title: "接続先の一時障害: 同じリクエストを一度だけ再試行する"
    feature: "一時障害からの回復"
    scenario: "既知の利用不可のみ再試行し、一般429・認証・出力開始後・中断時は再送しない"
    status: done
    priority: high
    type: regression
    source: [src/model-router.mjs, src/codex-bridge.mjs, scripts/patch_legacy_bridge.py]
    test_file: test/upstream-retry.test.mjs
    issues: [9]
    notes: "Retry-Afterの待機上限、失敗継続、秘密/会話/モデル不変、bridgeのヘッダー保持も検証する。"
  - id: TC-001
    title: "モデル切替: on offで接続定義と元設定を保持する"
    feature: "モデル切替"
    scenario: "on offで接続定義と元設定を保持する"
    status: done
    priority: medium
    type: regression
    source: [scripts/switch.sh, scripts/switch_config.py]
    test_file: test/test_switch.py
    issues: [1]
    notes: "8件の回帰テスト。接続定義保持、元設定復元、自動再起動なし、不正入力、旧版移行を検証。"
  - id: TC-002
    title: "切替アプリの接続: 実配布先から安全な切替スクリプトを呼ぶ"
    feature: "切替アプリの接続"
    scenario: "実配布先から安全な切替スクリプトを呼ぶ"
    status: done
    priority: medium
    type: regression
    source: [scripts/legacy-switch.sh]
    test_file: test/test_recover_thread.py
    issues: [3]
    notes: "旧メニューバー用の入口でも8件の設定切替回帰テストが成功。実配布先と同一内容を確認。"
  - id: TC-003
    title: "会話の復旧: 元の会話を保持してOpenAIへ履歴付き分岐する"
    feature: "会話の復旧"
    scenario: "元の会話を保持してOpenAIへ履歴付き分岐する"
    status: done
    priority: medium
    type: regression
    source: [scripts/recover_thread.py]
    test_file: test/test_recover_thread.py
    issues: [3]
    notes: "正式fork・接続先・実行中拒否・推論なし・stdio・異常メタデータ・終了タイムアウト・o系モデルを検証。全27件成功。現環境でも履歴保持とOpenAI接続を確認。"
  - id: TC-004
    title: "双方向モデル切替: 同じ会話の送信先を認証分離して振り分ける"
    feature: "双方向モデル切替"
    scenario: "同じ会話の送信先を認証分離して振り分ける"
    status: done
    priority: medium
    type: regression
    source: [src/model-router.mjs, src/tool-adapter.mjs]
    test_file: test/model-router.test.mjs
    issues: [5]
    notes: "認証分離、両方向、圧縮、未知モデル、履歴、リダイレクト拒否、タイムアウト。freeformツールはtest/tool-adapter.test.mjsで検証。"
  - id: TC-005
    title: "統合設定: 既存設定を保持して有効化と復元を行う"
    feature: "統合設定"
    scenario: "既存設定を保持して有効化と復元を行う"
    status: done
    priority: medium
    type: regression
    source: [scripts/unified_config.py, scripts/switch_config.py, scripts/install_router_service.py]
    test_file: test/test_unified_config.py
    issues: [5]
    notes: "設定の可逆性、カタログ、legacy切替との共存、複数行文字列、常駐登録解除待ちを検証。"
  - id: TC-006
    title: "同じ会話IDでCodexのモデルを両方向に切り替える"
    feature: "双方向モデル切替"
    scenario: "ChatGPT型の偽認証と模擬接続先で実Codexの双方向切替と保存会話の再開を検証する"
    status: done
    priority: high
    type: integration
    source: [src/model-router.mjs, src/tool-adapter.mjs, scripts/unified_config.py]
    test_file: test/codex-router-e2e.py
    issues: [5]
    notes: "ローカルCodex 0.163で双方向6ターンと同じIDでの保存会話再開2ターンを検証。外部推論なし。Codexとカタログが必要なためCI対象外。実応答も任意のlive-router-smoke.pyで確認済み。"
  - id: TC-007
    title: "推論履歴の往復: 説明文とツール呼び出しへ後置reasoningを引き継ぐ"
    feature: "双方向モデル切替"
    scenario: "後置reasoningと複合assistant応答を送信時に修復し、次のツール応答で欠落させない"
    status: done
    priority: high
    type: regression
    source: [src/model-router.mjs, src/tool-adapter.mjs]
    test_file: test/tool-adapter.test.mjs
    issues: [5]
    notes: "旧履歴の修復、SSE完了順序、説明文とツールへの推論共有、サイズ制限、途中失敗での実行抑止を検証。MOCK_TOOL_ROUNDTRIP=1で実Codexの双方向8ターン・16リクエストも検証する。"
  - id: TC-008
    title: "圧縮履歴の切替: 会話単位の引き継ぎ要約を分離する"
    feature: "双方向モデル切替"
    scenario: "対象会話の圧縮部分だけを要約し、他会話・認証・全体設定を変更せずOpenCodeへ渡す"
    status: done
    priority: high
    type: regression
    source: [src/compaction-handoff.mjs, src/model-router.mjs, scripts/install_router_service.py]
    test_file: test/model-router.test.mjs
    issues: [5]
    notes: "チャット別・認証別キャッシュ、同時切替、native会話の非変更、失敗時停止、Content-Type欠落のSSE、接続中の更新拒否を検証。live-compaction-smoke.pyで既存の暗号化圧縮履歴→OpenAI要約→DeepSeekの正常応答も確認。"
  - id: TC-009
    title: "応答待ち時間改善: 要約再利用と同時実行を分離する"
    feature: "応答待ち時間改善"
    scenario: "要約再利用と同時実行を分離する"
    status: done
    priority: medium
    type: regression
    source: [src/compaction-handoff.mjs]
    test_file: test/compaction-handoff.test.mjs
    issues: [9]
    notes: "指示/ID変更での再利用、同時要約1回、中断分離、認証/会話分離、失敗後再試行、完了SSE後の接続終了待ち省略を検証。"
  - id: TC-010
    title: "推論設定とセッション: 模擬上流への実送信を確認する"
    feature: "応答待ち時間改善"
    scenario: "DeepSeek V4の実パラメータと会話単位sessionを送信し、未知モデルには送らない"
    status: done
    priority: high
    type: integration
    source: [src/codex-bridge.mjs, src/upstream-options.mjs, scripts/patch_legacy_bridge.py]
    test_file: test/bridge-transport.test.mjs
    issues: [9]
    notes: "標準ソースとLEGACY_BRIDGE_SOURCE指定の本番一時コピーで成功。sessionは36文字UUID v5で会話分離。既知の旧helperのみバックアップ付き更新し未知ファイルを拒否する回帰を追加。"
  - id: TC-011
    title: "待ち時間計測: 本文や認証を記録せずストリームを先行配送する"
    feature: "応答待ち時間改善"
    scenario: "区間時間とキャッシュ状態を記録しても完了まで本文を保留しない"
    status: done
    priority: high
    type: regression
    source: [src/model-router.mjs]
    test_file: test/model-router.test.mjs
    issues: [9]
    notes: "キャッシュmiss/hit、時間/byte数、本文/認証/会話IDの非記録、最初のテキストの先行配送を検証。"
  - id: TC-012
    title: "入力整理: 連続する完全一致の指示だけを削減する"
    feature: "応答待ち時間改善"
    scenario: "ツール履歴・会話をまたぐ指示・元入力を変更しない"
    status: done
    priority: high
    type: regression
    source: [src/tool-adapter.mjs]
    test_file: test/context-input.test.mjs
    issues: [9]
